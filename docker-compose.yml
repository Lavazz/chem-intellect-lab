services:

  postgres:
    image: postgres:15
    container_name: chem-postgres
    environment:
      POSTGRES_USER: chem
      POSTGRES_PASSWORD: chem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chem-net


  redis:
    image: redis:7
    container_name: chem-redis
    ports:
      - "6379:6379"
    networks:
      - chem-net


  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: chem-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    networks:
      - chem-net


  kafka:
    image: apache/kafka:3.7.0
    container_name: chem-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@chem-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://chem-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    restart: always
    networks:
      - chem-net


  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: chem-gateway
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
    networks:
      - chem-net


  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    ports:
      - "9001:9001"
    depends_on:
      - postgres
      - keycloak
    networks:
      - chem-net


  reagent-service:
    build:
      context: .
      dockerfile: reagent-service/Dockerfile
    container_name: reagent-service
    ports:
      - "9002:9002"
    depends_on:
      - postgres
      - kafka
    networks:
      - chem-net


  experiment-service:
    build:
      context: .
      dockerfile: experiment-service/Dockerfile
    container_name: experiment-service
    ports:
      - "9003:9003"
    depends_on:
      - postgres
      - kafka
    networks:
      - chem-net


  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    ports:
      - "9004:9004"
    depends_on:
      - postgres
      - kafka
    networks:
      - chem-net


  ai-assistant-service:
    build:
      context: .
      dockerfile: ai-assistant-service/Dockerfile
    container_name: ai-assistant-service
    ports:
      - "9005:9005"
    depends_on:
      - kafka
    networks:
      - chem-net


volumes:
  pgdata:

networks:
  chem-net:
    driver: bridge
