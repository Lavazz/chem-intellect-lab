spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chem_lab
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: chem-intellect-group
      auto-offset-reset: earliest
      enable-auto-commit: true

reagent:
  kafka:
    topic-stock-out: reagent.stock.out
    topic-insufficient: reagent.stock.insufficient

logging:
  level:
    org.springframework.web: DEBUG
    com.chem.lab: INFO
